name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - "requirements.txt"
      - "infra/gcp/**"
      - ".github/workflows/deploy-gcp.yml"

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

env:
  PROJECT_ID: your-gcp-project
  REGION: us-central1
  REPO: risk-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/123456789/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: deployer@your-gcp-project.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker us-docker.pkg.dev --quiet
          docker build -t us-docker.pkg.dev/$PROJECT_ID/$REPO/app:${{ github.sha }} .
          docker push us-docker.pkg.dev/$PROJECT_ID/$REPO/app:${{ github.sha }}

      - name: Terraform apply
        working-directory: infra/gcp
        run: |
          terraform init
          terraform apply -auto-approve \
            -var="project_id=$PROJECT_ID" \
            -var="image_tag=${{ github.sha }}"
